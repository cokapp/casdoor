name: Build
on: [ push, pull_request ]

jobs:

  go-tests:
    name: Running Go tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: casdoor
          MYSQL_ROOT_PASSWORD: 123456
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.23'
          cache-dependency-path: ./go.mod
      - name: Tests
        run: |
          go test -v $(go list ./...) -tags skipCi
        working-directory: ./

  linter:
    name: Go-Linter
    runs-on: ubuntu-latest
    needs: [ go-tests ]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.23'
          cache: false

      # gen a dummy config file
      - run: touch dummy.yml

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --disable-all -c dummy.yml -E=gofumpt --max-same-issues=0 --timeout 5m --modules-download-mode=mod

  frontend:
    name: Front-end
    runs-on: ubuntu-latest
    needs: [ ]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: ./web/yarn.lock
      - name: Fetch Current version
        id: get-current-tag
        uses: actions-ecosystem/action-get-latest-tag@v1.6.0          
      - run: yarn install && CI=false PUBLIC_URL=${{ vars.CDN_DOMAIN }}/${{ vars.PROVIDER_PATH_PREFIX }}/${{ steps.get-current-tag.outputs.tag }}/ yarn run build
        working-directory: ./web
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'
          cache-dependency-path: ./go.mod
      - name: Upload Static Files to CDN
        run: |
          if [ -n "${{ secrets.PROVIDER_CLIENT_ID }}" ]; then
            # go test 以 deployment/ 为工作目录，依赖与 SDK 会查找 conf/app.conf
            mkdir -p deployment/conf
            cp conf/app.conf deployment/conf/app.conf
            go test -v ./deployment -run TestCdn -timeout 30m
          else
            echo "CDN secrets not set, skip upload."
          fi
        env:
          BUILD_VERSION: ${{ steps.get-current-tag.outputs.tag }}
          CDN_DOMAIN: ${{ vars.CDN_DOMAIN }}

          PROVIDER_OWNER: ${{ vars.PROVIDER_OWNER }}
          PROVIDER_NAME: ${{ vars.PROVIDER_NAME }}
          PROVIDER_CATEGORY: ${{ vars.PROVIDER_CATEGORY }}
          PROVIDER_TYPE: ${{ vars.PROVIDER_TYPE }}
          PROVIDER_CLIENT_ID: ${{ secrets.PROVIDER_CLIENT_ID }}
          PROVIDER_CLIENT_SECRET: ${{ secrets.PROVIDER_CLIENT_SECRET }}
          PROVIDER_REGION_ID: ${{ vars.PROVIDER_REGION_ID }}
          PROVIDER_BUCKET: ${{ vars.PROVIDER_BUCKET }}
          PROVIDER_ENDPOINT: ${{ vars.PROVIDER_ENDPOINT }}
          PROVIDER_CONTENT: ${{ vars.PROVIDER_CONTENT }}
          PROVIDER_CERT: ${{ secrets.PROVIDER_CERT }}
          PROVIDER_PATH_PREFIX: ${{ vars.PROVIDER_PATH_PREFIX }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: ./web/build

  backend:
    name: Back-end
    runs-on: ubuntu-latest
    needs: [ ]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.23'
          cache-dependency-path: ./go.mod
      - run: go version
      - name: Build
        run: |
          go build -race -ldflags "-extldflags '-static'"
        working-directory: ./

  release-and-push:
    name: Release And Push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [ frontend, backend ]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: -1
      - name: Download web build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: ./web-build-cdn
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Buildx (and create builder instance)
        id: buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: network=host
          platforms: linux/amd64
          driver: docker-container

      - name: Fetch Current version
        id: get-current-tag
        uses: actions-ecosystem/action-get-latest-tag@v1.6.0

      - name: Log in to Alibaba Cloud Container Registry
        uses: aliyun/acr-login@v1
        if: github.event_name == 'push'
        with:
          login-server: https://registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Push to Alibaba Cloud Container Registry - Standard Version
        id: build-standard
        uses: docker/build-push-action@v5
        if: github.event_name == 'push'
        with:
          context: .
          target: STANDARD
          platforms: linux/amd64
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/cokapp/casdoor:${{ steps.get-current-tag.outputs.tag }}
            registry.cn-hangzhou.aliyuncs.com/cokapp/casdoor:latest

      - name: Push to Alibaba Cloud Container Registry - CDN Version
        id: build-cdn
        uses: docker/build-push-action@v5
        if: github.event_name == 'push'
        with:
          context: .
          file: ./Dockerfile_cdn
          target: STANDARD
          platforms: linux/amd64
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/cokapp/casdoor:${{ steps.get-current-tag.outputs.tag }}-cdn
            registry.cn-hangzhou.aliyuncs.com/cokapp/casdoor:latest-cdn


          